# iOS build check: compiles the app for iPhone (web UI, Rust and the Swift side of the nyx-android
# plugin), produces an unsigned IPA, then launches a Simulator build and takes a screenshot of the
# first screen; also runs the plugin's pure Swift tests (NyxPolicies). A compile-and-test check:
#   - Supabase: placeholder values as in ci.yml (the app stops at the sign-in screen), unless the
#     repository has the VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY secrets, as android.yml: a fork
#     adds them (public values, shipped in every release) to get an IPA that can sign in;
#   - the IPA is for build verification. To try it on a phone, sideload it (AltStore, SideStore,
#     Sideloadly) with your own Apple ID and your own bundle ID;
#   - macOS minutes are costly: never automatic, on either repo. Only on a PR carrying the
#     `ci-github` label, or with the "Run workflow" button
#     (scripts/test/workflows-economie.test.mjs checks the gate).
# Xcode 26.x (not 27): Tauri 2.11 + Xcode 27 has a release-link bug (tauri-apps/tauri#16130).
# First run without src-tauri/gen/apple: `tauri ios init` generates it and the job uploads it as the
# artifact `nyx-ios-gen-apple`, to be committed like gen/android.
name: iOS

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

# A different label added to the PR must not cancel a run in progress: separate group.
concurrency:
  group: ios-${{ github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'ci-github') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ios:
    name: iOS build (unsigned IPA + Simulator)
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'push') ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci-github') ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled' &&
        contains(github.event.pull_request.labels.*.name, 'ci-github'))
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # As android.yml: the repository's secrets if set, otherwise placeholders as in ci.yml (the
      # Supabase client needs a URL at load time; no real call is made with them).
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.invalid' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'ci-placeholder' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Xcode 26
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: ios

      - name: xcodegen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      # Only while the Xcode project isn't committed yet
      - name: Generate the Xcode project
        id: init
        run: |
          if [ -d src-tauri/gen/apple ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            pnpm tauri ios init --ci
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the generated Xcode project
        if: steps.init.outputs.generated == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: nyx-ios-gen-apple
          include-hidden-files: true
          path: |
            src-tauri/gen/apple
            !src-tauri/gen/apple/build
            !src-tauri/gen/apple/Externals
            !src-tauri/gen/apple/**/xcuserdata

      - name: Warn if the Supabase secrets are missing
        if: env.VITE_SUPABASE_URL == 'https://example.invalid'
        run: echo "::warning::Secrets VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY missing - the IPA builds but can't sign in."

      # Also runs `pnpm build` (web UI) before Xcode compiles the Rust and Swift code.
      - name: Build the unsigned IPA
        run: pnpm tauri ios build --ci --target aarch64 --no-sign

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: nyx-ios-unsigned-ipa
          path: src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Build for the Simulator
        run: pnpm tauri ios build --ci --target aarch64-sim --debug

      # Launch on an iPhone Simulator: fails if the app isn't running 25 s later (plugin not linked,
      # Swift entry point missing, crash at start-up). The screenshot shows the safe-area layout.
      - name: Launch in the Simulator
        run: |
          set -euo pipefail
          # Xcode's archive also leaves incomplete .app folders: keep the first complete one whose
          # Info.plist says it was built for the Simulator.
          app=""
          while IFS= read -r candidate; do
            if [ -f "$candidate/Info.plist" ] &&
              plutil -extract CFBundleSupportedPlatforms json -o - "$candidate/Info.plist" | grep -q iPhoneSimulator; then
              app="$candidate"
              break
            fi
          done < <(find src-tauri/gen/apple/build "$HOME/Library/Developer/Xcode/DerivedData" -name '*.app' -type d 2>/dev/null)
          test -n "$app" || { echo "::error::No Simulator .app found"; exit 1; }
          echo "App: $app"
          # Info.ios.plist merged into the app's Info.plist
          modes="$(plutil -extract UIBackgroundModes json -o - "$app/Info.plist")"
          echo "UIBackgroundModes: $modes"
          test "$modes" = '["audio"]' || { echo "::error::Info.ios.plist not merged"; exit 1; }
          # iPhone: portrait and landscape listed (Info.ios.plist replaces the generated list); the
          # plugin locks portrait at runtime and unlocks landscape only for the player
          orientations="$(plutil -extract UISupportedInterfaceOrientations json -o - "$app/Info.plist")"
          echo "UISupportedInterfaceOrientations: $orientations"
          test "$orientations" = '["UIInterfaceOrientationPortrait","UIInterfaceOrientationLandscapeLeft","UIInterfaceOrientationLandscapeRight"]' || { echo "::error::iPhone orientations not merged"; exit 1; }
          # A model with a Dynamic Island, the same each run (the S3 check reads its safe area)
          udid="$(xcrun simctl list devices available | grep -E '^ +iPhone 17 \(' | head -n 1 | grep -oE '[0-9A-F-]{36}' || true)"
          test -n "$udid" || udid="$(xcrun simctl list devices available | grep -E 'iPhone 1[6-9] Pro \(' | head -n 1 | grep -oE '[0-9A-F-]{36}' || true)"
          test -n "$udid" || { echo "::error::No iPhone 17 or 16+ Pro Simulator available"; exit 1; }
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          # simctl prints "com.nyxplayer.app: <pid>"; the Simulator's apps are processes of this Mac
          pid="$(xcrun simctl launch "$udid" com.nyxplayer.app | awk '{print $NF}')"
          echo "PID: $pid"
          sleep 25
          kill -0 "$pid" || { echo "::error::Nyx is not running"; exit 1; }
          xcrun simctl io "$udid" screenshot signin.png

      # Spike S3: a debug-only hook (NYX_SPIKE_S3, SpikeS3Check.swift) puts a magenta view under the
      # page, makes the page transparent, enters the player's fullscreen and writes what UIKit
      # reports. simctl screenshots are always portrait-shaped, so the orientation comes from the JSON.
      - name: S3 check (view under the page, landscape, hidden bars, then back)
        run: |
          set -euo pipefail
          xcrun simctl terminate "$SIM_UDID" com.nyxplayer.app || true
          SIMCTL_CHILD_NYX_SPIKE_S3=1 xcrun simctl launch "$SIM_UDID" com.nyxplayer.app
          sleep 12
          xcrun simctl io "$SIM_UDID" screenshot s3-fullscreen.png
          data="$(xcrun simctl get_app_container "$SIM_UDID" com.nyxplayer.app data)"
          cat "$data/Library/Caches/nyx-spike-s3.json"
          jq -e '.orientation == "landscapeLeft" or .orientation == "landscapeRight"' "$data/Library/Caches/nyx-spike-s3.json"
          jq -e '.statusBarHidden == true and .homeIndicatorAutoHidden == true and .videoBelowWebView == true' "$data/Library/Caches/nyx-spike-s3.json"
          sleep 6
          cat "$data/Library/Caches/nyx-spike-s3-exit.json"
          jq -e '.orientation == "portrait" and .statusBarHidden == false' "$data/Library/Caches/nyx-spike-s3-exit.json"

      # Playback smoke: a 20 s 720p H.264/AAC clip made on this Mac and served on its loopback, never a
      # real stream. A debug-only hook (NYX_SMOKE_PLAY, SmokePlayCheck.swift) plays it through the
      # libmpv engine about 5 s after launch, then writes what the page would have seen: the last
      # time-pos, the error codes, mpv's video output and decoder, and the certificates in the CA file.
      - name: Playback smoke (local clip through libmpv)
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || brew install ffmpeg
          command -v jq >/dev/null || brew install jq
          mkdir -p smoke
          ffmpeg -f lavfi -i testsrc2=size=1280x720:rate=30:duration=20 -f lavfi -i sine=frequency=440:duration=20 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart -shortest -loglevel error -y smoke/clip.mp4
          python3 -m http.server 8765 --bind 127.0.0.1 --directory smoke > smoke-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do curl -fsI http://127.0.0.1:8765/clip.mp4 >/dev/null && break; sleep 0.5; done
          xcrun simctl terminate "$SIM_UDID" com.nyxplayer.app || true
          SIMCTL_CHILD_NYX_SMOKE_PLAY=http://127.0.0.1:8765/clip.mp4 xcrun simctl launch "$SIM_UDID" com.nyxplayer.app
          # Played at about 5 s, read at about 15 s: the screenshot falls in between
          sleep 12
          xcrun simctl io "$SIM_UDID" screenshot smoke-playing.png
          data="$(xcrun simctl get_app_container "$SIM_UDID" com.nyxplayer.app data)"
          result="$data/Library/Caches/nyx-smoke.json"
          for _ in $(seq 1 15); do test -f "$result" && break; sleep 1; done
          echo "Clip requests:"; cat smoke-server.log || true
          cat "$result"
          jq -e '.timePos > 2' "$result"
          jq -e '.ca.count >= 100' "$result"
          jq -e '.errors == []' "$result"

      # Pure Swift rules of the plugin (Keychain result mapping, network status), on this Mac.
      # After the builds, so a failing rule still leaves the build and launch results to read; and
      # run even when a build or the launch failed (only a cancelled run skips them), so the rules
      # still report.
      - name: Swift unit tests (NyxPolicies)
        if: ${{ !cancelled() }}
        run: swift test --package-path src-tauri/plugins/tauri-plugin-nyx-android/ios/NyxPolicies

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: nyx-ios-sim-screenshot
          path: |
            signin.png
            s3-fullscreen.png
            smoke-playing.png
          if-no-files-found: warn
          retention-days: 14
